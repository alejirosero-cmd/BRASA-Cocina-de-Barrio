# Nginx: sirve la web de Angular y hace de proxy inverso hacia la API de Django en /api.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Tiempo real (Server-Sent Events): sin búfer y con conexiones largas.
    location ~ ^/api/pedidos/(.+/)?eventos$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con hash en el nombre: caché larga.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifiesto de la PWA con su tipo correcto (Nginx no lo trae por defecto) y sin caché.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # El service worker no se cachea (para recibir actualizaciones).
    location ~ ^/(ngsw-worker\.js|ngsw\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Rutas de Angular (SPA): cualquier otra ruta devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
