# BRASA completo con un solo comando:  docker compose up --build
# Web en http://localhost:8088 (cámbialo con PUERTO_WEB)  ·  API detrás de Nginx en /api  ·  PostgreSQL con volumen persistente.
# Los secretos se leen del archivo .env de esta carpeta (copia .env.example).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brasa
      POSTGRES_USER: brasa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasa -d brasa"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ENTORNO: desarrollo
      DEBUG: "false"
      DATABASE_URL: postgres://brasa:${POSTGRES_PASSWORD}@db:5432/brasa
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      FRONTEND_URL: http://localhost:${PUERTO_WEB:-8088}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      NUM_PROXIES: "1"
      PAGOS_PROVEEDOR: simulado
      IMPUESTO_PORCENTAJE: ${IMPUESTO_PORCENTAJE:-19}
      SEMILLA_ADMIN_PASSWORD: ${SEMILLA_ADMIN_PASSWORD:-}
      SEMILLA_DEMO_PASSWORD: ${SEMILLA_DEMO_PASSWORD:-}
      SEMILLA_COCINA_PASSWORD: ${SEMILLA_COCINA_PASSWORD:-}
      SEMILLA_MESERO_PASSWORD: ${SEMILLA_MESERO_PASSWORD:-}
      # Keycloak: el navegador lo ve en localhost; el backend descarga las llaves por la red interna.
      KEYCLOAK_URL: http://localhost:${PUERTO_KEYCLOAK:-8089}
      KEYCLOAK_URL_INTERNA: http://keycloak:8080
      KEYCLOAK_REALM: brasa
      KEYCLOAK_CLIENTE: brasa-web
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/pagos/proveedor', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "${PUERTO_WEB:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Inicio de sesión único (SSO) para el personal: http://localhost:8089 (consola de administración en /admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD en .env}
      # Dirección pública: es el emisor ("iss") de los tokens que verifica el backend.
      KC_HOSTNAME: http://localhost:${PUERTO_KEYCLOAK:-8089}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Contraseñas de las cuentas del realm (se insertan en keycloak/brasa-realm.json al importarlo).
      KC_CLAVE_ADMIN: ${KC_CLAVE_ADMIN:?Define KC_CLAVE_ADMIN en .env}
      # Cocina y mesero pueden tener clave propia; si no, usan KC_CLAVE_PERSONAL.
      KC_CLAVE_COCINA: ${KC_CLAVE_COCINA:-${KC_CLAVE_PERSONAL:?Define KC_CLAVE_COCINA o KC_CLAVE_PERSONAL en .env}}
      KC_CLAVE_MESERO: ${KC_CLAVE_MESERO:-${KC_CLAVE_PERSONAL:?Define KC_CLAVE_MESERO o KC_CLAVE_PERSONAL en .env}}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${PUERTO_KEYCLOAK:-8089}:8080"
    restart: unless-stopped

volumes:
  datos_postgres:
